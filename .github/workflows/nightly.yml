# nightly.yml — nightly snapshot releases of the patched Wine builder, gated on change.
#
# Pipeline (runs on the default branch only — GitHub runs `schedule` there):
#   1. `changes` — decide, for each of the two apps, whether it has to be built:
#        patcher  FineWine Patcher.app and the patched Wine modules for CrossOver
#        app      FineWine.app with its own Wine runtime (hours)
#      Each is compared with the newest nightly that carries it: the patcher with the newest
#      snapshot that has a `finewine-patcher-…zip`, the app with the newest that has a
#      `FineWine-…zip`. It is built when files it is built from have changed since then
#      (.github/scripts/nightly-components.sh says which files those are). So a change to
#      the app alone builds the app alone, a change to the patcher alone the patcher alone,
#      and one that failed to build is tried again the next night, because the snapshot it
#      is compared with is still the old one. A manual dispatch builds what it is asked for
#      (both by default). Days without changes produce no build and no release.
#   2. `build`    — the patcher: the build-wine reusable workflow (fresh build at HEAD).
#      `finewine` — the app: build-finewine-full.yml, in parallel.
#      Each runs only when `changes` asked for it.
#   3. `release` — download the artifacts of whatever was built and succeeded, and publish
#      them as a NEW GitHub PRE-release on every run, tagged `nightly_<CrossOver version>.<UTC date>_<sha>`
#      (e.g. `nightly_26.3.0.20260925_55ae553e…`). Each snapshot keeps its own assets and
#      notes — nothing is replaced, moved, or deleted — and the newest prerelease sorts to
#      the top of the Releases page.
#
# Notes:
#   - cron timing is best-effort (GitHub may delay scheduled runs by minutes to hours).
#   - The published .app is ad-hoc signed: right-click → Open on first launch.
#   - LGPL-2.1-or-later: the release notes point at the exact CrossOver source tarball
#     (the "complete corresponding source" = this repo's patches + that tarball).
#   - When BLUESKY_HANDLE + BLUESKY_APP_PASSWORD are configured, each NEW snapshot posts a
#     Bluesky thread (template: Type / Version / Build time / Download; replies = commits).

name: nightly

on:
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC (01:00 ET)
  workflow_dispatch: # manual override: always builds + releases
    inputs:
      components:
        description: What to build
        required: false
        default: both
        type: choice
        options:
          - both
          - patcher
          - app

permissions:
  contents: write # needed to create the release and its tag

concurrency:
  group: nightly
  cancel-in-progress: false # never kill a nightly mid-build

jobs:
  changes:
    name: Detect changes since last nightly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_patcher: ${{ steps.gate.outputs.build_patcher }}
      build_app: ${{ steps.gate.outputs.build_app }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      commits: ${{ steps.gate.outputs.commits }}
      short_sha: ${{ steps.gate.outputs.short_sha }}
      started_epoch: ${{ steps.clock.outputs.started_epoch }}
    steps:
      # The Bluesky thread reports this pipeline's duration (docs/wiki are separate workflows).
      - name: Record pipeline start
        id: clock
        shell: bash
        run: echo "started_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags (baseline = newest nightly-* tag)

      - name: Change gate
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASKED_FOR: ${{ inputs.components }}
        run: |
          set -euo pipefail
          echo "event: $GITHUB_EVENT_NAME / head: $(git rev-parse --short HEAD)"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

          # Baseline for the notes: the newest nightly snapshot tag — on every event, manual
          # dispatches included, so release notes and the Bluesky thread only ever list commits
          # newer than the last published nightly (never "the last N commits of main").
          #
          # Tags are `nightly_<cxver>.<UTC YYYYMMDD>_<sha>` (the date part is fixed width, so
          # lexical order == chronological order); also match the transitional
          # `nightly-YYYYMMDD-HHMM` format in case it ever shipped.
          LATEST="$(git for-each-ref 'refs/tags/nightly_*' 'refs/tags/nightly-*' --sort=-refname --count=1 --format='%(refname:short)')"
          if [ -n "$LATEST" ]; then
            BASE="$(git rev-parse "${LATEST}^{}")"
            echo "baseline ($LATEST): $BASE"
          elif git rev-parse -q --verify refs/tags/nightly >/dev/null 2>&1; then
            # Legacy rolling `nightly` tag from before per-run releases: use it once as
            # the baseline so the first run after the switch doesn't re-release the
            # whole history.
            BASE="$(git rev-parse 'nightly^{}')"
            echo "baseline (legacy rolling nightly tag): $BASE"
          else
            BASE="$(git rev-list --max-parents=0 HEAD)"
            echo "no previous nightly tag -> first nightly"
          fi

          # Baseline for each app: the newest nightly that carries it. A snapshot can hold one
          # app without the other (only one had changes, or one failed to build), so the newest
          # tag is not the right thing to compare both with. The releases' assets say which
          # snapshot has what; newest first, as the API lists them.
          RELEASES="$(gh api "repos/$GH_REPO/releases?per_page=60" \
            --jq '.[] | select(.tag_name | startswith("nightly")) | [.tag_name, ([.assets[].name] | join(" "))] | @tsv' || true)"
          baseline_for() { # asset-name pattern (grep -E) -> commit of the newest nightly with such an asset, or nothing
            local tag names
            while IFS=$'\t' read -r tag names; do
              [ -n "$tag" ] || continue
              # shellcheck disable=SC2086 # the names are split into words on purpose
              if printf '%s\n' $names | grep -Eq "$1" && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                git rev-parse "${tag}^{}"
                return 0
              fi
            done <<< "$RELEASES"
            return 0
          }
          PATCHER_BASE="$(baseline_for '^finewine-patcher-.*\.zip$')"
          APP_BASE="$(baseline_for '^FineWine-.*\.zip$')"
          # Before per-app snapshots every nightly carried the patcher, so without an answer
          # from the API the newest tag stands in for it. The app has no such stand-in: no
          # snapshot with the app means it has never been built, and it is built now.
          [ -n "$PATCHER_BASE" ] || PATCHER_BASE="$BASE"
          echo "patcher is compared with ${PATCHER_BASE:-nothing}; app with ${APP_BASE:-nothing (never in a nightly)}"

          needs_build() { # component, baseline commit -> true|false
            local component="$1" base="$2" changed
            if [ -z "$base" ]; then echo true; return; fi
            changed="$(git diff --name-only "$base"..HEAD || true)"
            printf '%s\n' "$changed" | .github/scripts/nightly-components.sh | sed -n "s/^$component=//p"
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # A manual dispatch builds what it was asked for, changed or not.
            case "${ASKED_FOR:-both}" in
              patcher) BUILD_PATCHER=true; BUILD_APP=false ;;
              app)     BUILD_PATCHER=false; BUILD_APP=true ;;
              *)       BUILD_PATCHER=true; BUILD_APP=true ;;
            esac
            echo "manual dispatch (${ASKED_FOR:-both}) -> forced build"
          else
            BUILD_PATCHER="$(needs_build patcher "$PATCHER_BASE")"
            BUILD_APP="$(needs_build app "$APP_BASE")"
          fi
          echo "build the patcher: $BUILD_PATCHER / build the app: $BUILD_APP"
          echo "build_patcher=$BUILD_PATCHER" >> "$GITHUB_OUTPUT"
          echo "build_app=$BUILD_APP" >> "$GITHUB_OUTPUT"

          {
            echo "base_sha=$BASE"
            echo "commits<<EOT"
            git log --oneline --no-decorate "$BASE"..HEAD
            echo "EOT"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        shell: bash
        run: |
          PATCHER="${{ steps.gate.outputs.build_patcher }}"; APP="${{ steps.gate.outputs.build_app }}"
          if [ "$PATCHER" = "true" ] || [ "$APP" = "true" ]; then
            echo "✅ Building a snapshot — FineWine Patcher: ${PATCHER:-false} · FineWine.app: ${APP:-false}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🌙 No build-affecting changes since the last nightly snapshot — skipping build & release." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Nightly Wine build
    needs: changes
    if: needs.changes.outputs.build_patcher == 'true'
    uses: ./.github/workflows/build-wine.yml
    with:
      cx_version: "26.3.0"
      runner: "xcode-27" # macOS 27.0 + Xcode 27.0 RC; change to macos-26 for the GA image
      build_patcher_app: true
      # Without this, build-app.sh stamps its default "1.1.0", so wizard telemetry from
      # nightly users reports a stale version that never existed for that build.
      app_version: nightly-${{ needs.changes.outputs.short_sha }}

  finewine:
    name: Nightly FineWine.app
    needs: changes
    if: needs.changes.outputs.build_app == 'true'
    uses: ./.github/workflows/build-finewine-full.yml
    with:
      runner: "xcode-27" # keep in step with the Wine build above
      # The app reports the snapshot it was released as, like the patcher.
      app_version: nightly-${{ needs.changes.outputs.short_sha }}
      # The app's update check starts on the Nightly channel in a nightly build.
      channel: "nightly"

  release:
    name: Snapshot pre-release
    needs: [changes, build, finewine]
    # Whatever was built and succeeded is published: either app alone, or both. One that
    # failed is left out of this snapshot and tried again the next night (see `changes`).
    # `always()` is what lets this job run after a need that failed or was skipped.
    if: ${{ always() && !cancelled() && (needs.build.result == 'success' || needs.finewine.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CX_VER: "26.3.0"
      # Empty when the Bluesky bot is not configured; step-level `if:` can read job env.
      BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      BLUESKY_PDS: ${{ vars.BLUESKY_PDS }}
    steps:
      # The release job needs the repo's scripts (e.g. .github/scripts/post-bluesky-thread.py);
      # downloading build artifacts does not populate the workspace with them.
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: "*"
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          ls -l assets
          # The failed-build logs of FineWine.app are an artifact too; only zips are assets.
          find assets -mindepth 1 ! -name '*.zip' -delete 2>/dev/null || true
          ( cd assets && sha256sum ./*.zip > SHA256SUMS.txt )
          if ls assets/FineWine-*.zip >/dev/null 2>&1; then echo "HAS_FINEWINE_APP=true" >> "$GITHUB_ENV"
          else echo "HAS_FINEWINE_APP=false" >> "$GITHUB_ENV"; fi
          if ls assets/finewine-patcher-*.zip >/dev/null 2>&1; then echo "HAS_PATCHER=true" >> "$GITHUB_ENV"
          else echo "HAS_PATCHER=false" >> "$GITHUB_ENV"; fi
          # Asked for and not there: it failed to build.
          if [ "${{ needs.changes.outputs.build_app }}" = "true" ] && ! ls assets/FineWine-*.zip >/dev/null 2>&1; then
            echo "::warning::FineWine.app is not in this snapshot: its build did not succeed"; fi
          if [ "${{ needs.changes.outputs.build_patcher }}" = "true" ] && ! ls assets/finewine-patcher-*.zip >/dev/null 2>&1; then
            echo "::warning::FineWine Patcher is not in this snapshot: its build did not succeed"; fi

      - name: Write release notes
        shell: bash
        env:
          NOTES_SHA: ${{ github.sha }}
          NOTES_RUN_NUMBER: ${{ github.run_number }}
          NOTES_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTES_CX_VER: ${{ env.CX_VER }}
          # multiline-capable: passed through the process environment, never inlined
          # into the shell script, so commit subjects can't break quoting
          NOTES_COMMITS: ${{ needs.changes.outputs.commits }}
        run: |
          set -euo pipefail
          TODAY="$(date -u +%F)"
          export NOTES_TODAY="$TODAY"
          python3 - <<'PY'
          import os

          template = """## Nightly snapshot — @@TODAY@@ (`@@SHA@@`)

          > ⚠️ **Automated, untested snapshot** built from `main` by
          > [run #@@RUN_NUMBER@@](@@RUN_URL@@).
          > Gameplay is only verified on the maintainer's Mac — treat this as a test build.

          ### What's inside

          | Asset | What it is |
          |---|---|
          @@APP_ROW@@
          @@PATCHER_ROWS@@
          | `SHA256SUMS.txt` | SHA-256 checksums of the assets |

          @@CONTENTS_NOTE@@

          ### Commits since the previous nightly

          ```text
          @@COMMITS@@
          ```

          ### Provenance & license

          - Built on the `xcode-27` GitHub runner image (macOS 27.0 / Xcode 27.0; x86_64 Wine output under Rosetta).
          - FineWine.app's runtime, when the app is in this snapshot, is built from source by `scripts/build-finewine.sh` (upstream Wine, FEX, DXMT and MoltenVK with this repo's patches, each at the revision its build script pins) at `@@SHA@@`. The runtime's own checks are not run in CI.
          - CrossOver Wine source (for the patcher): [crossover-sources-@@CX_VER@@.tar.gz](https://media.codeweavers.com/pub/crossover/source/crossover-sources-@@CX_VER@@.tar.gz) + this repo's `patches/` at `@@SHA@@`.
          - The patched Wine modules are **LGPL-2.1-or-later**; the bundled MoltenVK is **Apache-2.0**. The complete corresponding source is the CrossOver tarball above, the pinned MoltenVK revision, and this repo's `patches/` (see `patcher-app/README.md`).
          """
          # The template lives inside the workflow's literal block scalar, so strip the
          # common leading indentation before writing it out.
          lines = template.splitlines()
          indent = min((len(l) - len(l.lstrip()) for l in lines if l.strip()), default=0)
          template = "\n".join(l[indent:] if l.strip() else "" for l in lines) + "\n"

          app_row = (
              "| `FineWine-…zip` | **FineWine.app** — the menu bar app with its own Wine runtime inside. "
              "Unzip it, move it to Applications and open it (right-click → Open the first time: it is ad-hoc signed). "
              "Needs an Apple silicon Mac on macOS 26 or later; it does not need CrossOver or Rosetta. "
              "An installed FineWine on the Nightly update channel offers this build by itself. |"
          )
          patcher_rows = (
              "| `finewine-patcher-…zip` | **FineWine Patcher.app** — patches a copy of your CrossOver @@CX_VER@@ with the anti-cheat Wine modules and a patched MoltenVK (open it and follow the UI) |\n"
              "| `finewine-wine-modules-…zip` | The three patched Wine modules alone — for `scripts/swap-into-crossover.sh` users |"
          )
          has_app = os.environ.get("HAS_FINEWINE_APP") == "true"
          has_patcher = os.environ.get("HAS_PATCHER") == "true"
          # A snapshot holds what had changes since the last snapshot that carried it.
          if has_app and has_patcher:
              note = "The patcher and the Wine modules require CrossOver **@@CX_VER@@** (the Wine ABI must match), Apple silicon, macOS 15+ and Rosetta 2."
          elif has_patcher:
              note = ("Requires CrossOver **@@CX_VER@@** (the Wine ABI must match), Apple silicon, macOS 15+ and Rosetta 2.\n\n"
                      "FineWine.app is not in this snapshot: nothing it is built from has changed since the last snapshot that carries it, or its build did not succeed.")
          else:
              note = "FineWine Patcher is not in this snapshot: nothing it is built from has changed since the last snapshot that carries it, or its build did not succeed."
          template = template.replace("@@APP_ROW@@", app_row) if has_app else template.replace("@@APP_ROW@@\n", "")
          template = template.replace("@@PATCHER_ROWS@@", patcher_rows) if has_patcher else template.replace("@@PATCHER_ROWS@@\n", "")
          template = template.replace("@@CONTENTS_NOTE@@", note)

          out = template
          for key in ("TODAY", "SHA", "RUN_NUMBER", "RUN_URL", "CX_VER", "COMMITS"):
              out = out.replace("@@" + key + "@@", os.environ.get("NOTES_" + key, ""))
          if not os.environ.get("NOTES_COMMITS", "").strip():
              out = out.replace(
                  "### Commits since the previous nightly\n\n```text\n\n```\n\n", ""
              )
          with open("notes.md", "w") as f:
              f.write(out)
          print(out)
          PY

          # The Bluesky thread's replies are the commit list.
          printf '%s\n' "$NOTES_COMMITS" > commits.txt

      - name: Publish a new nightly pre-release
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Tag and title share one stamp: <CrossOver version>.<UTC build date>_<full commit>.
          # e.g. tag     nightly_26.3.0.20260925_55ae553e8eb4f14645c8479bdd044b3f9751b2f7
          #      title   Endfield FW 26.3.0.20260925_55ae553e8eb4f14645c8479bdd044b3f9751b2f7
          # The date part is fixed width, so tags sort lexically in chronological order
          # (the change gate's baseline lookup relies on this).
          STAMP="${CX_VER}.$(date -u +%Y%m%d)_${{ github.sha }}"
          TAG="nightly_${STAMP}"
          TITLE="Endfield FW ${STAMP}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "NIGHTLY_STAMP=$STAMP" >> "$GITHUB_ENV"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same version+date+commit: a re-run of this exact snapshot (failed-job re-run,
            # double dispatch). Published releases are immutable, so keep what's there.
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "release $TAG already exists (re-run of the same snapshot) -> keeping it"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "creating release $TAG at $GITHUB_SHA"
            # gh creates the tag at --target when it doesn't exist yet
            gh release create "$TAG" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file notes.md \
              assets/*.zip assets/SHA256SUMS.txt
          fi

          gh release view "$TAG" --json name,tagName,isPrerelease,assets --jq '{name, tagName, isPrerelease, assets: [.assets[].name]}'

      - name: Announce on Bluesky
        # Only for a newly created nightly: re-running the same snapshot must not re-post.
        if: ${{ success() && steps.publish.outputs.created == 'true' && env.BLUESKY_HANDLE != '' && env.BLUESKY_APP_PASSWORD != '' }}
        shell: bash
        env:
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_PDS: ${{ vars.BLUESKY_PDS }}
          BLUESKY_MAX_POSTS: ${{ vars.BLUESKY_MAX_POSTS }}
          THREAD_TYPE: Nightly
          VERSION: ${{ env.NIGHTLY_STAMP }}
          PIPELINE_STARTED_EPOCH: ${{ needs.changes.outputs.started_epoch }}
          DOWNLOAD_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
          BODY_FILE: commits.txt
        run: python3 .github/scripts/post-bluesky-thread.py

      - name: Summary
        shell: bash
        run: |
          cat > summary.md <<'EOT'
          ## Nightly snapshot published

          | | |
          |---|---|
          | Title | %TITLE% |
          | Tag | %TAG% (pre-release) |
          | Commit | `%SHA%` |
          | Assets | %ASSETS% |
          | URL | %RELEASE_URL% |
          EOT
          LIST=""
          if [ "${HAS_FINEWINE_APP:-false}" = true ]; then LIST="FineWine.app zip · "; fi
          if [ "${HAS_PATCHER:-false}" = true ]; then LIST="${LIST}Patcher.app zip · modules zip · "; fi
          LIST="${LIST}SHA256SUMS.txt"
          sed -i \
            -e "s|%ASSETS%|$LIST|g" \
            -e "s|%TITLE%|$RELEASE_TITLE|g" \
            -e "s|%TAG%|$RELEASE_TAG|g" \
            -e "s|%SHA%|${{ github.sha }}|g" \
            -e "s|%RELEASE_URL%|${{ github.server_url }}/${{ github.repository }}/releases/tag/$RELEASE_TAG|g" \
            summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
  # No wiki job: the wiki takes long to generate, so only full releases (release.yml, from
  # release/* branches) regenerate it.
