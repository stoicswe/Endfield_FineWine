# Issue-form dropdowns preselect their first option, so `required: true` alone cannot reject
# the generated "Unselected" choice. This post-submission gate labels and comments on invalid
# version selections, then clears the label when the author edits the issue to a valid release.

name: validate issue version

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: validate-issue-version-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Require a full release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event.issue.pull_request == null }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate the selected Patcher version
        run: python3 .github/scripts/validate-issue-version.py
